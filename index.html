<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>الإشارة الأخيرة — رحلات استكشاف الفضاء</title>
    <meta name="theme-color" content="#fcfaf7" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preload" href="/fonts/ibm-plex-sans-arabic-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-sans-arabic-700.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      /* Set theme before React paints, preventing a white flash in dark mode. */
      try {
        const saved = localStorage.getItem("tls-theme");
        const theme = saved === "dark" || saved === "light"
          ? saved
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute(
          "content", theme === "dark" ? "#181626" : "#fcfaf7"
        );
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <meta
      name="description"
      content="الإشارة الأخيرة: مغامرة عربية لاستكشاف القمر والمريخ لعمر 8–16 سنة. اكتشف قصص المهمات، وشاهد مجسّماتها، وتعلّم من صور ناسا ومصادرها."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
