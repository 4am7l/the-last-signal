<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>الإشارة الأخيرة — رحلات استكشاف الفضاء</title>
    <meta name="theme-color" content="#f8f9ff" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="/samsung.ttf" as="font" type="font/ttf" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&amp;display=swap" rel="stylesheet" />
    <script>
      /* Set theme before React paints, preventing a white flash in dark mode. */
      try {
        const saved = localStorage.getItem("tls-theme");
        const theme = saved === "dark" || saved === "light"
          ? saved
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute(
          "content", theme === "dark" ? "#12151c" : "#f8f9ff"
        );
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <meta
      name="description"
      content="الإشارة الأخيرة: أرشيف عربي تفاعلي لمهمات القمر والمريخ. استكشف المعدات ثلاثية الأبعاد، ومواقع الهبوط، وقصص الرحلات بمصادرها."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
